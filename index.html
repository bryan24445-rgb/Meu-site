<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Aleatório</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: rgba(0,0,0,0.3);
    }

    h1 {
      margin: 0;
      font-size: 2.5em;
    }

    .container {
      padding: 40px;
    }

    button {
      padding: 15px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ff4b5c;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background: #ff2e44;
    }

    .card {
      margin-top: 30px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      display: inline-block;
      min-width: 250px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌐 Site Aleatório</h1>
    <p>Clique no botão para gerar algo aleatório</p>
  </header>

  <div class="container">
    <button onclick="gerar()">Gerar</button>

    <div class="card" id="resultado">
      Nada ainda...
    </div>
  </div>

  <script>
    const frases = [
      "Você vai ter sorte hoje 🍀",
      "Coma uma pizza 🍕",
      "Aprenda algo novo 📚",
      "Hora de jogar 🎮",
      "Beba água 💧",
      "Durma cedo 😴",
      "Foque nos seus objetivos 🚀",
      "Hora de Assistir 📺"
    ];

    function gerar() {
      const random = Math.floor(Math.random() * frases.length);
      document.getElementById('resultado').innerText = frases[random];
    }
  </script>

  <footer style="margin-top:40px;padding:20px;background:rgba(0,0,0,0.4);">
    <p>© 2026 Site Aleatório | Feito por Bryan 🚀</p>
  </footer>

</body>
</html>
